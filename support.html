<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Support Recipients</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="p-6">
        <!-- Header -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 class="text-3xl font-bold text-indigo-900">💝 Monthly Support Recipients</h1>
                    <p class="text-gray-600 mt-2">Managing 50 families + 30 singles</p>
                </div>
                <button id="addRecipientBtn" class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 font-semibold">
                    ➕ Add Recipient
                </button>
                <script>
                    const sp = new URLSearchParams(window.location.search);
                    const spName = decodeURIComponent(sp.get('name') || '');
                    const spEditors = ['Francine'];
                    if (sp.get('role') && sp.get('role') !== 'admin' && !spEditors.includes(spName)) {
                        document.getElementById('addRecipientBtn').style.display = 'none';
                    }
                </script>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mt-4">
                <div class="bg-blue-50 p-4 rounded-lg">
                    <div class="text-sm text-gray-600">Total Recipients</div>
                    <div class="text-2xl font-bold text-blue-600" id="totalRecipients">0</div>
                </div>
                <div class="bg-green-50 p-4 rounded-lg">
                    <div class="text-sm text-gray-600">Families</div>
                    <div class="text-2xl font-bold text-green-600" id="totalFamilies">0</div>
                </div>
                <div class="bg-purple-50 p-4 rounded-lg">
                    <div class="text-sm text-gray-600">Singles</div>
                    <div class="text-2xl font-bold text-purple-600" id="totalSingles">0</div>
                </div>
                <div class="bg-orange-50 p-4 rounded-lg">
                    <div class="text-sm text-gray-600">Monthly Total</div>
                    <div class="text-2xl font-bold text-orange-600" id="monthlyTotal">₹0</div>
                </div>
            </div>

            <!-- Organisation Tabs -->
            <div class="flex gap-2 mt-6 mb-1 flex-wrap">
                <button id="tabAll" class="org-tab px-5 py-2 rounded-full font-semibold text-sm border-2 border-indigo-600 bg-indigo-600 text-white transition">All</button>
                <button id="tabHope" class="org-tab px-5 py-2 rounded-full font-semibold text-sm border-2 border-indigo-300 text-indigo-700 bg-white hover:bg-indigo-50 transition">🕊️ Hope</button>
                <button id="tabSeeds" class="org-tab px-5 py-2 rounded-full font-semibold text-sm border-2 border-green-300 text-green-700 bg-white hover:bg-green-50 transition">🌱 Seeds</button>
                <button id="tabAlive" class="org-tab px-5 py-2 rounded-full font-semibold text-sm border-2 border-orange-300 text-orange-700 bg-white hover:bg-orange-50 transition">⚡ Alive</button>
            </div>

            <!-- Search and Filter -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mt-3">
                <input type="text" id="searchInput" placeholder="Search by name..." class="px-4 py-2 border rounded-lg">
                <select id="filterType" class="px-4 py-2 border rounded-lg">
                    <option value="">All Types</option>
                    <option value="Family">Families</option>
                    <option value="Single">Singles</option>
                </select>
                <select id="filterTeam" class="px-4 py-2 border rounded-lg">
                    <option value="">All Teams</option>
                </select>
                <select id="filterSwiss" class="px-4 py-2 border rounded-lg">
                    <option value="">All Swiss Accounts</option>
                </select>
                <button id="exportBtn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">
                    📊 Export CSV
                </button>
                <button id="exportPdfBtn" class="bg-rose-400 text-white px-4 py-2 rounded-lg hover:bg-rose-500">
                    📄 Export PDF
                </button>
            </div>
        </div>

        <!-- Recipients Table -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-indigo-600 text-white">
                        <tr>
                            <th class="px-4 py-3 text-left">Org</th><th class="px-4 py-3 text-left">Name</th>
                            <th class="px-4 py-3 text-left">Type</th>
                            <th class="px-4 py-3 text-left">Monthly Amount</th>
                            <th class="px-4 py-3 text-left">Swiss Account</th>
                            <th class="px-4 py-3 text-left">Team</th>
                            <th class="px-4 py-3 text-left">Bank/UPI</th>
                            <th class="px-4 py-3 text-left">Notes</th>
                            <th class="px-4 py-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="recipientsTableBody">
                        <!-- Recipients will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="recipientModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full p-6">
            <h2 id="modalTitle" class="text-2xl font-bold mb-4">Add Recipient</h2>
            <form id="recipientForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-2">Name *</label>
                        <input type="text" id="recipientName" required class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Type *</label>
                        <select id="recipientType" required class="w-full px-4 py-2 border rounded-lg">
                            <option value="">Select Type</option>
                            <option value="Family">Family</option>
                            <option value="Single">Single</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Currency *</label>
                        <select id="recipientCurrency" required class="w-full px-4 py-2 border rounded-lg">
                            <option value="CHF" selected>CHF</option>
                            <option value="INR">INR (₹)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Monthly Amount *</label>
                        <input type="number" step="0.01" id="recipientAmount" required class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Swiss Account Holder *</label>
                        <input type="text" id="recipientSwissAccount" required placeholder="Friend's name" class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Team *</label>
                        <input type="text" id="recipientTeam" required placeholder="e.g., Coimbatore, Salem" class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Organisation *</label>
                        <select id="recipientOrg" class="w-full px-4 py-2 border rounded-lg">
                            <option value="Hope">🕊️ Hope</option>
                            <option value="Seeds">🌱 Seeds</option>
                            <option value="Alive">⚡ Alive</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Bank Account / UPI *</label>
                        <input type="text" id="recipientBankAccount" required class="w-full px-4 py-2 border rounded-lg">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Notes (optional)</label>
                    <textarea id="recipientNotes" rows="3" class="w-full px-4 py-2 border rounded-lg" placeholder="Any additional information..."></textarea>
                </div>
                <div class="flex gap-3 justify-end pt-4">
                    <button type="button" id="cancelBtn" class="px-6 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600">Cancel</button>
                    <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBq6u09yrCy_2QZJXpuh-RKWo0_5wXsTag",
            authDomain: "hope-association-loans.firebaseapp.com",
            projectId: "hope-association-loans",
            storageBucket: "hope-association-loans.firebasestorage.app",
            messagingSenderId: "432884261468",
            appId: "1:432884261468:web:d92185f8bce4f550c17c99"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let recipients = [];
        let editingId = null;
        let currentOrgFilter = '';
        
        function setOrgTab(org) {
            currentOrgFilter = org;
            const tabs = {
                '': {id:'tabAll', bg:'bg-indigo-600', border:'border-indigo-600'},
                'Hope': {id:'tabHope', bg:'bg-indigo-600', border:'border-indigo-600'},
                'Seeds': {id:'tabSeeds', bg:'bg-green-600', border:'border-green-600'},
                'Alive': {id:'tabAlive', bg:'bg-orange-500', border:'border-orange-500'}
            };
            document.querySelectorAll('.org-tab').forEach(btn => {
                btn.className = btn.className
                    .replace(/bg-indigo-600|bg-green-600|bg-orange-500/g, 'bg-white')
                    .replace('text-white', '');
            });
            const t = tabs[org];
            const btn = document.getElementById(t.id);
            if (btn) {
                btn.classList.remove('bg-white');
                btn.classList.add(t.bg, 'text-white');
            }
            renderRecipients();
        }
        
        // Read role from URL params
        const supportParams = new URLSearchParams(window.location.search);
        const supportRole = supportParams.get('role') || 'admin';
        const supportName = decodeURIComponent(supportParams.get('name') || '');
        const supportEditors = ['Francine']; // Non-admins who can edit support
        
        let currentUser = {
            email: 'admin@hope.org',
            role: (supportRole === 'admin' || supportEditors.includes(supportName)) ? 'admin' : supportRole,
            name: supportName || 'Admin'
        };

        // Wait for authentication before loading data
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log('Support: authenticated as', user.email);
                loadRecipients();
            } else {
                console.log('Support: waiting for authentication...');
            }
        });

        // Load recipients
        async function loadRecipients() {
            console.log('Loading recipients...');
            try {
                const snapshot = await getDocs(collection(db, 'support_recipients'));
                recipients = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                console.log('Loaded recipients:', recipients);
                updateStats();
                renderRecipients();
                populateTeamFilter();
            } catch (error) {
                console.error('Error loading recipients:', error);
                if (error.message && error.message.includes('permission')) {
                    console.log('Waiting for authentication...');
                } else {
                    alert('Error loading recipients: ' + error.message);
                }
            }
        }

        // Real-time listener
        onSnapshot(collection(db, 'support_recipients'), (snapshot) => {
            recipients = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
            updateStats();
            renderRecipients();
            populateTeamFilter();
        });

        // Update stats
        function updateStats() {
            const families = recipients.filter(r => r.type === 'Family').length;
            const singles = recipients.filter(r => r.type === 'Single').length;
            const monthlyTotalCHF = recipients.filter(r => r.currency !== 'INR').reduce((sum, r) => sum + (r.monthly_amount || 0), 0);
            const monthlyTotalINR = recipients.filter(r => r.currency === 'INR').reduce((sum, r) => sum + (r.monthly_amount || 0), 0);

            document.getElementById('totalRecipients').textContent = recipients.length;
            document.getElementById('totalFamilies').textContent = families;
            document.getElementById('totalSingles').textContent = singles;
            document.getElementById('monthlyTotal').innerHTML = 'CHF ' + monthlyTotalCHF.toLocaleString('de-CH') + (monthlyTotalINR > 0 ? '<br><span style="font-size:14px">+ ₹' + monthlyTotalINR.toLocaleString('en-IN') + '</span>' : '');
        }

        // Populate team filter
        function populateTeamFilter() {
            const teams = new Set(recipients.map(r => r.team).filter(Boolean));
            const filterTeam = document.getElementById('filterTeam');
            const currentValue = filterTeam.value;
            
            filterTeam.innerHTML = '<option value="">All Teams</option>';
            Array.from(teams).sort().forEach(team => {
                filterTeam.innerHTML += `<option value="${team}">${team}</option>`;
            });
            filterTeam.value = currentValue;
            
            // Populate Swiss Account filter
            const swiss = new Set(recipients.map(r => r.swiss_account_holder).filter(Boolean));
            const filterSwiss = document.getElementById('filterSwiss');
            const currentSwiss = filterSwiss.value;
            
            filterSwiss.innerHTML = '<option value="">All Swiss Accounts</option>';
            Array.from(swiss).sort().forEach(s => {
                filterSwiss.innerHTML += `<option value="${s}">${s}</option>`;
            });
            filterSwiss.value = currentSwiss;
        }

        // Render recipients
        function renderRecipients() {
            console.log('Rendering recipients. Total:', recipients.length);
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filterType = document.getElementById('filterType').value;
            const filterTeam = document.getElementById('filterTeam').value;
            const filterSwiss = document.getElementById('filterSwiss').value;

            let filtered = recipients.filter(r => {
                if (searchTerm && !r.name.toLowerCase().includes(searchTerm)) return false;
                if (filterType && r.type !== filterType) return false;
                if (currentOrgFilter && (r.organization || 'Hope') !== currentOrgFilter) return false;
                if (filterTeam && r.team !== filterTeam) return false;
                if (filterSwiss && r.swiss_account_holder !== filterSwiss) return false;
                return true;
            });

            console.log('Filtered recipients:', filtered.length);

            // Sort by name
            filtered.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

            const tbody = document.getElementById('recipientsTableBody');
            
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="px-4 py-8 text-center text-gray-500">No recipients found</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(r => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="px-4 py-3"><span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:12px;background:${(r.organization||'Hope')==='Seeds'?'#dcfce7;color:#15803d':(r.organization||'Hope')==='Alive'?'#ffedd5;color:#c2410c':'#e0e7ff;color:#3730a3'}">${r.organization||'Hope'}</span></td>
                    <td class="px-4 py-3 font-semibold">${r.name || 'N/A'}</td>
                    <td class="px-4 py-3">
                        <span class="px-2 py-1 rounded-full text-xs font-semibold ${r.type === 'Family' ? 'bg-green-100 text-green-800' : 'bg-purple-100 text-purple-800'}">
                            ${r.type || 'N/A'}
                        </span>
                    </td>
                    <td class="px-4 py-3 font-semibold text-indigo-600">${r.currency === 'INR' ? '₹' : 'CHF '}${(r.monthly_amount || 0).toLocaleString(r.currency === 'INR' ? 'en-IN' : 'de-CH')}</td>
                    <td class="px-4 py-3">${r.swiss_account_holder || 'N/A'}</td>
                    <td class="px-4 py-3">${r.team || 'N/A'}</td>
                    <td class="px-4 py-3 text-sm font-mono">${(() => { if (r.bank_account) return r.bank_account + (r.upi ? ' / UPI: ' + r.upi : ''); const parts = []; if (r.account_number) parts.push(r.account_number); if (r.ifsc) parts.push(r.ifsc); if (r.account_name) parts.push(r.account_name); if (r.upi) parts.push('UPI: ' + r.upi); return parts.length ? parts.join(' / ') : 'N/A'; })()}</td>
                    <td class="px-4 py-3 text-sm text-gray-600">${r.notes || ''}</td>
                    <td class="px-4 py-3 text-center">
                        ${currentUser.role === 'admin' ? `
                            <button onclick="editRecipient('${r.id}')" class="text-yellow-600 hover:text-yellow-800 mr-2">✏️</button>
                            <button onclick="deleteRecipient('${r.id}', '${r.name}')" class="text-red-600 hover:text-red-800">🗑️</button>
                        ` : '-'}
                    </td>
                </tr>
            `).join('');
            console.log('Table updated successfully');
        }

        // Modal functions
        document.getElementById('addRecipientBtn').onclick = () => {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Add Recipient';
            document.getElementById('recipientForm').reset();
            document.getElementById('recipientModal').classList.remove('hidden');
        };

        document.getElementById('cancelBtn').onclick = () => {
            document.getElementById('recipientModal').classList.add('hidden');
        };

        // Edit recipient
        window.editRecipient = function(id) {
            if (currentUser.role !== 'admin') return;
            
            editingId = id;
            const recipient = recipients.find(r => r.id === id);
            
            document.getElementById('modalTitle').textContent = 'Edit Recipient';
            document.getElementById('recipientName').value = recipient.name;
            document.getElementById('recipientType').value = recipient.type;
            document.getElementById('recipientCurrency').value = recipient.currency || 'CHF';
            document.getElementById('recipientAmount').value = recipient.monthly_amount;
            document.getElementById('recipientSwissAccount').value = recipient.swiss_account_holder;
            document.getElementById('recipientTeam').value = recipient.team;
            document.getElementById('recipientOrg').value = recipient.organization || 'Hope';
            // Build full bank string from all stored fields
            // Use bank_account if it exists (already consolidated), otherwise build from old fields
            if (recipient.bank_account) {
                document.getElementById('recipientBankAccount').value = recipient.bank_account;
            } else {
                const bankParts = [];
                if (recipient.account_number) bankParts.push(recipient.account_number);
                if (recipient.ifsc) bankParts.push(recipient.ifsc);
                if (recipient.account_name) bankParts.push(recipient.account_name);
                if (recipient.upi) bankParts.push('UPI: ' + recipient.upi);
                document.getElementById('recipientBankAccount').value = bankParts.join(' / ');
            }
            document.getElementById('recipientNotes').value = recipient.notes || '';
            
            document.getElementById('recipientModal').classList.remove('hidden');
        };

        // Delete recipient
        window.deleteRecipient = async function(id, name) {
            if (currentUser.role !== 'admin') return;
            
            if (!confirm(`Are you sure you want to delete ${name} from the support list?`)) return;
            
            try {
                await deleteDoc(doc(db, 'support_recipients', id));
                alert('Recipient deleted successfully!');
            } catch (error) {
                console.error('Error deleting recipient:', error);
                alert('Error deleting recipient. Please try again.');
            }
        };

        // Form submit
        document.getElementById('recipientForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const recipientData = {
                name: document.getElementById('recipientName').value.trim(),
                type: document.getElementById('recipientType').value,
                currency: document.getElementById('recipientCurrency').value,
                monthly_amount: parseFloat(document.getElementById('recipientAmount').value),
                swiss_account_holder: document.getElementById('recipientSwissAccount').value.trim(),
                team: document.getElementById('recipientTeam').value.trim(),
                organization: document.getElementById('recipientOrg').value,
                bank_account: document.getElementById('recipientBankAccount').value.trim(),
                account_number: null,
                ifsc: null,
                account_name: null,
                notes: document.getElementById('recipientNotes').value.trim(),
                updated_at: new Date().toISOString(),
                updated_by: currentUser.email
            };

            try {
                if (editingId) {
                    await updateDoc(doc(db, 'support_recipients', editingId), recipientData);
                    alert('Recipient updated successfully!');
                } else {
                    recipientData.created_at = new Date().toISOString();
                    recipientData.created_by = currentUser.email;
                    await addDoc(collection(db, 'support_recipients'), recipientData);
                    alert('Recipient added successfully!');
                }
                
                document.getElementById('recipientModal').classList.add('hidden');
            } catch (error) {
                console.error('Error saving recipient:', error);
                alert('Error saving recipient. Please try again.');
            }
        };

        function getFilteredRecipients() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filterType = document.getElementById('filterType').value;
            const filterTeam = document.getElementById('filterTeam').value;
            const filterSwiss = document.getElementById('filterSwiss').value;
            return recipients.filter(r => {
                if (searchTerm && !r.name.toLowerCase().includes(searchTerm)) return false;
                if (filterType && r.type !== filterType) return false;
                if (currentOrgFilter && (r.organization || 'Hope') !== currentOrgFilter) return false;
                if (filterTeam && r.team !== filterTeam) return false;
                if (filterSwiss && r.swiss_account_holder !== filterSwiss) return false;
                return true;
            }).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        }

        // Search and filter
        document.getElementById('searchInput').oninput = renderRecipients;
        document.getElementById('filterType').onchange = renderRecipients;
        document.getElementById('filterTeam').onchange = renderRecipients;
        
        // Wire org tab buttons
        document.getElementById('tabAll').addEventListener('click', () => setOrgTab(''));
        document.getElementById('tabHope').addEventListener('click', () => setOrgTab('Hope'));
        document.getElementById('tabSeeds').addEventListener('click', () => setOrgTab('Seeds'));
        document.getElementById('tabAlive').addEventListener('click', () => setOrgTab('Alive'));
        document.getElementById('filterSwiss').onchange = renderRecipients;

        // Export to PDF
        document.getElementById('exportPdfBtn').onclick = () => {
            const filtered = getFilteredRecipients();
            const orgLabel = currentOrgFilter || 'All';
            const teamLabel = document.getElementById('filterTeam').value || 'All Teams';
            const date = new Date().toLocaleDateString('de-CH');
            const totalCHF = filtered.reduce((s,r) => (r.currency||'CHF')==='CHF' ? s+(parseFloat(r.monthly_amount)||0) : s, 0);
            const totalFamilies = filtered.filter(r=>r.type==='Family').length;
            const totalSingles = filtered.filter(r=>r.type==='Single').length;

            const orgColors = {Hope:'#3730a3',Seeds:'#15803d',Alive:'#c2410c'};
            const orgBg = {Hope:'#e0e7ff',Seeds:'#dcfce7',Alive:'#ffedd5'};

            const rows = filtered.map((r,i) => {
                const org = r.organization||'Hope';
                const bank = r.bank_account || [r.account_number,r.ifsc,r.account_name].filter(Boolean).join(' / ') || '—';
                const orgBadge = `<span style="background:${orgBg[org]||'#e0e7ff'};color:${orgColors[org]||'#3730a3'};padding:2px 7px;border-radius:10px;font-size:9px;font-weight:700">${org}</span>`;
                const typeBadge = r.type==='Family'
                    ? `<span style="background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:10px;font-size:9px;font-weight:700">Family</span>`
                    : `<span style="background:#f3e8ff;color:#6b21a8;padding:2px 7px;border-radius:10px;font-size:9px;font-weight:700">Single</span>`;
                return `<tr style="background:${i%2===0?'#f8faff':'#ffffff'}">
                    <td style="color:#9ca3af;font-size:10px;text-align:center">${i+1}</td>
                    <td style="font-weight:700;color:#1e1b4b">${r.name||'—'}</td>
                    <td>${orgBadge}</td>
                    <td>${typeBadge}</td>
                    <td style="font-weight:700;color:#3730a3;white-space:nowrap">${r.currency||'CHF'} ${parseFloat(r.monthly_amount||0).toLocaleString('de-CH')}</td>
                    <td style="color:#374151">${r.swiss_account_holder||'—'}</td>
                    <td style="color:#374151">${r.team||'—'}</td>
                    <td style="color:#6b7280;font-size:9px;max-width:160px;word-break:break-all">${bank}</td>
                    <td style="color:#6b7280;font-size:10px">${r.notes||''}</td>
                </tr>`;
            }).join('');

            const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
            <title>Hope Support Recipients</title>
            <style>
                * { box-sizing: border-box; margin: 0; padding: 0; }
                body { font-family: 'Segoe UI', Arial, sans-serif; background: #fff; color: #111; }
                
                .header {
                    background: linear-gradient(135deg, #1e1b4b 0%, #3730a3 100%);
                    padding: 24px 28px 20px;
                    color: white;
                }
                .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 4px; }
                .header .subtitle { font-size: 11px; opacity: 0.7; }
                
                .meta-bar {
                    background: #f1f5f9;
                    border-bottom: 1px solid #e2e8f0;
                    padding: 10px 28px;
                    display: flex;
                    gap: 24px;
                    font-size: 11px;
                    color: #475569;
                }
                .meta-bar strong { color: #1e1b4b; }
                
                .stats {
                    display: flex;
                    gap: 16px;
                    padding: 16px 28px;
                    border-bottom: 2px solid #e0e7ff;
                }
                .stat-box {
                    background: #f8faff;
                    border: 1px solid #e0e7ff;
                    border-radius: 8px;
                    padding: 10px 18px;
                    text-align: center;
                }
                .stat-box .val { font-size: 18px; font-weight: 800; color: #3730a3; }
                .stat-box .lbl { font-size: 9px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

                .table-wrap { padding: 16px 28px 24px; }
                
                table { width: 100%; border-collapse: collapse; }
                thead tr {
                    background: linear-gradient(90deg, #3730a3, #4f46e5);
                    color: white;
                }
                th {
                    padding: 9px 10px;
                    text-align: left;
                    font-size: 9px;
                    text-transform: uppercase;
                    letter-spacing: 0.07em;
                    font-weight: 600;
                }
                td { padding: 7px 10px; vertical-align: middle; }
                tr:last-child td { border-bottom: none; }
                
                .footer {
                    margin: 0 28px 28px;
                    background: linear-gradient(90deg, #1e1b4b, #3730a3);
                    color: white;
                    border-radius: 10px;
                    padding: 14px 20px;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    font-size: 12px;
                }
                .footer .total { font-size: 18px; font-weight: 800; }
                
                @page { size: A4 landscape; margin: 8mm; }
                @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
            </style></head><body>

            <div class="header">
                <h1>💝 Hope Association — Monthly Support Recipients</h1>
                <div class="subtitle">hopeausland-bern.ch &nbsp;·&nbsp; Confidential</div>
            </div>

            <div class="meta-bar">
                <span><strong>Organisation:</strong> ${orgLabel}</span>
                <span><strong>Team:</strong> ${teamLabel}</span>
                <span><strong>Date:</strong> ${date}</span>
            </div>

            <div class="stats">
                <div class="stat-box"><div class="val">${filtered.length}</div><div class="lbl">Recipients</div></div>
                <div class="stat-box"><div class="val">${totalFamilies}</div><div class="lbl">Families</div></div>
                <div class="stat-box"><div class="val">${totalSingles}</div><div class="lbl">Singles</div></div>
                <div class="stat-box" style="border-color:#fbbf24;background:#fffbeb"><div class="val" style="color:#b45309">CHF ${totalCHF.toLocaleString('de-CH')}</div><div class="lbl">Monthly Total</div></div>
            </div>

            <div class="table-wrap">
                <table>
                    <thead><tr>
                        <th style="width:28px">#</th>
                        <th>Name</th><th>Org</th><th>Type</th><th>Monthly</th>
                        <th>Swiss Account</th><th>Team</th><th>Bank / UPI</th><th>Notes</th>
                    </tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>

            <div class="footer">
                <span>Hope Association Bern &nbsp;·&nbsp; Brunnmattstrasse 50, 3007 Bern</span>
                <span>Monthly Total: <span class="total">CHF ${totalCHF.toLocaleString('de-CH')}</span></span>
            </div>

            </body></html>`;

            const win = window.open('', '_blank');
            win.document.write(html);
            win.document.close();
            setTimeout(() => win.print(), 500);
        };

        // Export to CSV
        document.getElementById('exportBtn').onclick = () => {
            let csv = 'Name,Type,Currency,Monthly Amount,Swiss Account Holder,Team,Bank Account/UPI,Notes\n';
            
            getFilteredRecipients().forEach(r => {
                csv += `"${r.name}","${r.type}","${r.currency || 'CHF'}",${r.monthly_amount},"${r.swiss_account_holder}","${r.team}","${(() => { const p = []; if (r.account_number) p.push(r.account_number); if (r.ifsc) p.push(r.ifsc); if (r.bank_account && r.bank_account !== r.account_number) p.push(r.bank_account); if (r.account_name) p.push(r.account_name); return p.join(' / ') || ''; })()}","${r.notes || ''}"\n`;
            });
            
            const BOM = '\uFEFF';
            const blob = new Blob([BOM + csv], {type: 'text/csv;charset=utf-8;'});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Support_Recipients_' + new Date().toISOString().split('T')[0] + '.csv';
            a.click();
            window.URL.revokeObjectURL(url);
        };
    </script>
</body>
</html>
